[project]
name = "geoagent-backend"
version = "0.1.0"
description = "GeoAgent backend — FastAPI application foundation (Phase 2)"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.13",
    "email-validator>=2.1",
    "fastapi>=0.115,<1",
    "geoalchemy2>=0.15",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2",
    "PyJWT>=2.8",
    "pwdlib[argon2]>=0.2",
    "pyproj>=3.6",
    "shapely>=2",
    "SQLAlchemy>=2.0,<3",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]  # FastAPI Depends() in default arguments is intentional.

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic", "fastapi", "geoalchemy2", "pwdlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning", "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning"]